name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  distributions:
    name: Build release artifacts
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-distributions.yml
    with:
      ref: ${{ needs.release_please.outputs.release_sha }}

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - release_please
      - distributions
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sideview
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sideview-*
          path: dist
          merge-multiple: true

      - name: Publish release artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs:
      - release_please
      - publish-testpypi
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sideview
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sideview-*
          path: dist
          merge-multiple: true

      - name: Publish release artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-release-assets:
    name: Attach GitHub release assets
    needs:
      - release_please
      - publish-pypi
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sideview-*
          path: dist
          merge-multiple: true

      - name: Attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ needs.release_please.outputs.tag_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --clobber
