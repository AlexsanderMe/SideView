name: Build distributions

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to build
        required: true
        type: string
        default: master

permissions:
  contents: read

env:
  BUILD_VERSION: "1.5.0"
  PYTHON_VERSION: "3.13"
  TWINE_VERSION: "6.2.0"
  WEBVIEW2_VERSION: "1.0.3912.50"

jobs:
  sdist:
    name: Linux sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install build and test tools
        run: |
          python -m pip install \
            "build==${BUILD_VERSION}" \
            "twine==${TWINE_VERSION}" \
            "pytest>=8,<10" \
            "PySide6>=6.5"

      - name: Run tests
        run: python -m pytest

      - name: Build source distribution
        run: python -m build --sdist

      - name: Validate source distribution
        run: |
          python -m twine check --strict dist/*
          python scripts/validate_distribution.py dist

      - name: Install from source distribution
        run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz

      - name: Load installed native backend
        working-directory: ${{ runner.temp }}
        run: >-
          python -c
          "import sideview; from sideview._backend import NativeBackend;
          assert sideview.__version__ != '0+unknown'; NativeBackend()"

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sideview-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-wheel:
    name: Windows x64 wheel
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $sdkParent = Join-Path $env:RUNNER_TEMP "webview2-sdk"
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory $sdkParent `
            -NonInteractive

          $sdkDir = Join-Path $sdkParent "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $sdkDir "build\native\include\WebView2.h"))) {
            throw "WebView2 SDK was not installed at $sdkDir"
          }
          "SKBUILD_CMAKE_ARGS=-DWEBVIEW2_SDK_DIR=$sdkDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install build and test tools
        run: >-
          python -m pip install
          "build==${{ env.BUILD_VERSION }}"
          "twine==${{ env.TWINE_VERSION }}"
          "pytest>=8,<10"
          "PySide6>=6.5"

      - name: Run tests
        run: python -m pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Validate wheel
        shell: pwsh
        run: |
          python -m twine check --strict dist/*
          python scripts/validate_distribution.py dist

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl -File -ErrorAction Stop).FullName
          python -m pip install --force-reinstall --no-deps $wheel

      - name: Load installed native backend
        working-directory: ${{ runner.temp }}
        run: >-
          python -c
          "import sideview; from sideview._backend import NativeBackend;
          assert sideview.__version__ != '0+unknown'; NativeBackend()"

      - name: Upload Windows wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sideview-wheel-windows-x64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos-wheel:
    name: macOS universal2 wheel
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      ARCHFLAGS: -arch x86_64 -arch arm64
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      QT_QPA_PLATFORM: offscreen
      SKBUILD_CMAKE_ARGS: >-
        -DCMAKE_OSX_ARCHITECTURES=x86_64;arm64
        -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build and test tools
        run: |
          python -m pip install \
            "build==${BUILD_VERSION}" \
            "twine==${TWINE_VERSION}" \
            "pytest>=8,<10" \
            "PySide6>=6.5"

      - name: Run tests
        run: python -m pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Validate wheel
        run: |
          python -m twine check --strict dist/*
          python scripts/validate_distribution.py dist

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify native library
        working-directory: ${{ runner.temp }}
        run: |
          library="$(
            python -c \
              'from pathlib import Path; import sideview; print(Path(sideview.__file__).parent / "libsideview_native.dylib")'
          )"
          lipo -verify_arch x86_64 arm64 "${library}"
          codesign --verify --verbose "${library}"
          python -c \
            "import sideview; from sideview._backend import NativeBackend; assert sideview.__version__ != '0+unknown'; NativeBackend()"

      - name: Upload macOS wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sideview-wheel-macos-universal2
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
