[build-system]
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "sideview"
version = "0.4.2"
description = "A lightweight native webview widget for PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlexsanderMe" }]
keywords = ["pyside6", "qt", "webview", "webview2", "webkit", "webkitgtk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["PySide6>=6.5"]

[project.urls]
Homepage = "https://github.com/AlexsanderMe/SideView"
Documentation = "https://github.com/AlexsanderMe/SideView#readme"
Repository = "https://github.com/AlexsanderMe/SideView"
Issues = "https://github.com/AlexsanderMe/SideView/issues"
Changelog = "https://github.com/AlexsanderMe/SideView/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "twine>=6,<8",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
strict-config = true
cmake.build-type = "Release"
cmake.source-dir = "native"
cmake.version = ">=3.24"
wheel.packages = ["src/sideview"]
wheel.py-api = "py3"
wheel.reproducible = true
sdist.reproducible = true
sdist.include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "native/CMakeLists.txt",
    "native/linux/webview_host.cpp",
    "native/macos/webview_host.mm",
    "native/native_webview.h",
    "native/win32/webview_host.cpp",
    "release-please-config.json",
    "scripts/benchmark_frame_stream.py",
    "scripts/build_linux.sh",
    "scripts/build_windows.ps1",
    "scripts/validate_distribution.py",
    "scripts/validate_windows_native_bounds.py",
    "scripts/validate_pull_request_title.py",
    "src/sideview/__init__.py",
    "src/sideview/_backend.py",
    "src/sideview/py.typed",
    "src/sideview/widget.py",
]
sdist.exclude = [
    "**/__pycache__/**",
    "**/*.py[cod]",
    ".github/**",
    ".gitattributes",
    ".gitignore",
    ".release-please-manifest.json",
    "src/sideview/*.dll",
    "src/sideview/*.dylib",
    "src/sideview/*.so",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
